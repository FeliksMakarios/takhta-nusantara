<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Takhta Nusantara</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Tata letak: peta laut nila di kiri, panel titah di kanan. Warna nila (indigo batik) dan soga, aksen prada emas. */
:root{
  --bg:#e9ebf1; --panel:#f6f7fa; --raise:#ffffff; --ink:#1a1f3a; --muted:#5a6080; --line:#d2d6e2;
  --sea:#c3cfe3; --grid:#a9b8d3; --coast:#2c3765; --accent:#2c3a8f; --accent-ink:#ffffff;
  --gold:#a87a12; --gold-soft:#f3e6c4; --danger:#b0352b; --danger-soft:#f6dcd8; --ok:#2d7a4d; --ok-soft:#d9eedf; --warn:#9a6a10; --warn-soft:#f4e8c8;
  --halo:#ffffffd9; --labink:#151a33; --facline:#1a1f3acc; --regline:#1a1f3a40; --sel:#1a1f3a;
  --f-display:'Marcellus SC', 'Trajan Pro', Georgia, serif;
  --f-body:'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1222; --panel:#151a2d; --raise:#1b2138; --ink:#e7e9f3; --muted:#9ba2c2; --line:#2a3152;
  --sea:#17213d; --grid:#26345a; --coast:#8f9fd6; --accent:#8b9cff; --accent-ink:#0e1222;
  --gold:#e3b54c; --gold-soft:#3a3018; --danger:#ec7a6e; --danger-soft:#3c1e1c; --ok:#6cc792; --ok-soft:#173326; --warn:#e3b54c; --warn-soft:#352b14;
  --halo:#0e1222cc; --labink:#f1f2f8; --facline:#0b0e1bdd; --regline:#0b0e1b55; --sel:#ffffff; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1222; --panel:#151a2d; --raise:#1b2138; --ink:#e7e9f3; --muted:#9ba2c2; --line:#2a3152;
  --sea:#17213d; --grid:#26345a; --coast:#8f9fd6; --accent:#8b9cff; --accent-ink:#0e1222;
  --gold:#e3b54c; --gold-soft:#3a3018; --danger:#ec7a6e; --danger-soft:#3c1e1c; --ok:#6cc792; --ok-soft:#173326; --warn:#e3b54c; --warn-soft:#352b14;
  --halo:#0e1222cc; --labink:#f1f2f8; --facline:#0b0e1bdd; --regline:#0b0e1b55; --sel:#ffffff; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
.small{font-size:13px;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.h3,h3{font-size:17px;letter-spacing:.02em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.btn{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.gold{background:var(--gold-soft);color:var(--gold)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--fc);display:inline-block;box-shadow:0 0 0 1px #0002}
.meter{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.gold i{background:var(--gold)} .meter.red i{background:var(--danger)} .meter.green i{background:var(--ok)} .meter.blue i{background:var(--accent)}
.pips{display:inline-flex;gap:4px;vertical-align:middle}
.pips i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--gold)}
.pips i.on{background:var(--gold)}
.pips.sm i{width:8px;height:8px}

/* ----- layar awal ----- */
#start{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;max-width:1280px;margin:0 auto}
.hero{position:relative;border-radius:14px;overflow:hidden;background:var(--sea);display:grid}
.heromap,.herotext{grid-area:1/1}
.heromap svg{display:block;width:100%;height:auto;opacity:.92}
.minimap .sea{fill:var(--sea)} .minimap .tiles polygon{stroke:#0000001a;stroke-width:.5}
.minimap .e-coast{stroke:var(--coast);stroke-width:1;fill:none;opacity:.7} .minimap .e-fac{stroke:var(--facline);stroke-width:1.2;fill:none} .minimap .e-reg{stroke:var(--regline);stroke-width:.5;fill:none}
.herotext{position:relative;z-index:1;align-self:end;padding:20px 24px;max-width:560px;background:linear-gradient(90deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 85%,transparent) 70%,transparent);border-radius:0 12px 0 0}
.herotext h1{font-size:clamp(34px,5.4vw,60px);line-height:1;letter-spacing:.02em;margin:6px 0 10px}
.herotext p{margin:0;max-width:52ch}
.startgrid{display:grid;grid-template-columns:320px 1fr;gap:24px;margin-top:24px;align-items:start}
.profile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.lvl{display:flex;justify-content:space-between;align-items:baseline}
.lvn{font-family:var(--f-display);font-size:26px}
.xp{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.cont{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border-radius:8px;background:var(--gold-soft)}
.badges{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{display:grid;grid-template-columns:34px 1fr;column-gap:8px;align-items:center;padding:6px;border-radius:8px;border:1px dashed var(--line);opacity:.6}
.badge.got{opacity:1;border-style:solid;border-color:var(--gold);background:var(--gold-soft)}
.badge .bg{grid-row:span 2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:13px;border:1.5px solid var(--gold);color:var(--gold)}
.badge.got .bg{background:var(--gold);color:var(--bg)}
.badge .bn{font-weight:700;font-size:13px;line-height:1.2}
.badge .bd{font-size:11.5px;color:var(--muted);line-height:1.25}
.kingdoms{min-width:0;display:flex;flex-direction:column;gap:14px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.kband{height:8px;background:var(--fc)}
.kin{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.kin h3{font-size:19px;line-height:1.15}
.kin p{margin:0;font-size:14px}
.kstatus{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kfacts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:2px 0}
.kfacts div{background:var(--bg);border-radius:6px;padding:4px 8px}
.kfacts dt{font-size:11px;color:var(--muted)} .kfacts dd{margin:0;font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.kbonus{font-size:13px!important;color:var(--muted)} .kbonus b{color:var(--ink)}
.kin .btn{margin-top:auto;align-self:flex-start}
.kcard.locked{filter:grayscale(.85);opacity:.7}
.lockmsg{margin-top:auto;font-size:13px;font-weight:700;color:var(--muted);padding:6px 10px;border:1px dashed var(--line);border-radius:8px;align-self:flex-start}
.howto{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.howto summary{cursor:pointer;font-weight:700}
.howto ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;max-width:75ch}

/* ----- layar permainan ----- */
#game{min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crest{width:40px;height:40px;border-radius:50%;background:var(--fc);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;box-shadow:inset 0 0 0 3px #ffffff40,0 0 0 2px var(--gold);flex:none}
.who{min-width:0}
.who .kn{font-family:var(--f-display);font-size:17px;line-height:1.1}
.who .rn{font-size:13px;color:var(--muted)}
.year{display:flex;flex-direction:column;align-items:center;padding:0 6px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.year .yl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.year .yv{font-family:var(--f-display);font-size:28px;line-height:1}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0}
.stats dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:0;font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats small{font-size:11.5px;color:var(--muted)} .stats small.pos{color:var(--ok)} .stats small.neg{color:var(--danger)}
.topact{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.board{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:start}
.mapcol{min-width:0;display:flex;flex-direction:column;gap:8px}
.maptools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#hover{font-size:13px;color:var(--muted);min-height:1.5em}
.mapscroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:var(--sea)}
.map{display:block;width:100%;min-width:760px;height:auto}
.map .sea{fill:var(--sea)}
.map .grid line{stroke:var(--grid);stroke-width:.6;stroke-dasharray:2 3}
.map .tick{fill:var(--muted);font:600 7.5px var(--f-mono);text-anchor:middle}
.map .tiles polygon{stroke:#00000014;stroke-width:.5;cursor:pointer;transition:filter .15s}
.map .tiles polygon:hover{filter:brightness(1.12)}
.map path{fill:none;pointer-events:none}
.map .e-reg{stroke:var(--regline);stroke-width:.6}
.map .e-fac{stroke:var(--facline);stroke-width:1.5}
.map .e-coast{stroke:var(--coast);stroke-width:1.1;opacity:.8}
.map .e-mine{stroke:var(--gold);stroke-width:2.6;stroke-linejoin:round}
.map .e-sel{stroke:var(--sel);stroke-width:2.2;stroke-dasharray:4 2;stroke-linejoin:round}
.map .hatch{pointer-events:none}
.map .labels{pointer-events:none}
.map .lab{font:700 8.5px var(--f-body);fill:var(--labink);text-anchor:middle;paint-order:stroke;stroke:var(--halo);stroke-width:2.6px;stroke-linejoin:round}
.map .lab.fac{font:400 8.5px var(--f-display);letter-spacing:.04em}
.map .lab.sel{font-size:9.5px}
.map .capdot{fill:var(--labink);stroke:var(--halo);stroke-width:1}
.map .capstar{fill:var(--gold);stroke:var(--halo);stroke-width:.8}
#legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block;box-shadow:0 0 0 1px #0002}
.lg.ramp i{width:90px}
.lg.ramp.makmur i{background:linear-gradient(90deg,#c96a4a,#e8d9a8,#3f8f5a)}
.lg.ramp.tenteram i{background:linear-gradient(90deg,#b8433a,#e6d39a,#3f7fa8)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);max-height:calc(100dvh - 104px);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{flex:1;border:0;background:transparent;padding:11px 8px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
#tabbody{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.colonial{border-color:color-mix(in srgb,#e07b22 55%,var(--line))}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rhead h2{font-size:21px;line-height:1.15}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0}
.facts dt{font-size:11.5px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.facts .wide{grid-column:1/-1;display:grid;grid-template-columns:110px 1fr;align-items:center}
.facts .wide .meter{width:calc(100% - 40px);margin-left:6px}
.acts{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.act{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.al{font-weight:700;font-size:14px}
.ad{font-size:12.5px;color:var(--muted)}
.act .btn{font-family:var(--f-mono);font-size:12.5px;min-width:76px}
.tscroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td:not(:first-child),.tbl th:not(:first-child){text-align:right;font-family:var(--f-mono)}
.tbl tbody tr{cursor:pointer} .tbl tbody tr:hover,.tbl tbody tr.on{background:var(--gold-soft)}
.cap{font-size:10.5px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.person{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:5px}
.pn{font-family:var(--f-display);font-size:16px}
.pr{font-size:12.5px;color:var(--muted)}
.pstats{display:flex;flex-wrap:wrap;gap:6px 12px;font-family:var(--f-mono);font-size:12.5px}
.traits{display:flex;flex-wrap:wrap;gap:5px}
.fam,.nob,.diplist,.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.fam li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fam li:last-child{border:0}
select{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
select.full{width:100%}
.seat{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center}
.seat select{width:100%;min-width:0}
.sl{font-size:13px;font-weight:600}
.nob li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.loy{font-family:var(--f-mono);white-space:nowrap}
.dip{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.dh{display:flex;align-items:center;gap:8px}
.drow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.war{border:1px solid var(--danger-soft);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.targets{display:flex;flex-wrap:wrap;gap:6px}
.log li{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.log .ly{font-family:var(--f-mono);color:var(--muted)}
.log li.baik span:last-child{color:var(--ok)} .log li.buruk span:last-child{color:var(--danger)} .log li.penting span:last-child{font-weight:700} .log li.kabar span:last-child{color:var(--muted)}

/* ----- modal dan toast ----- */
#modal{position:fixed;inset:0;z-index:50;background:#070a1699;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.mcard{background:var(--raise);color:var(--ink);border-radius:14px;max-width:540px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px;border-top:5px solid var(--gold);box-shadow:0 20px 60px #0006}
.mcard.wide{max-width:640px}
.mcard h2{font-size:25px;line-height:1.15}
.mbody p{margin:0 0 10px;max-width:62ch}
.mopts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.primary .oh{color:inherit;opacity:.85}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.ot{font-weight:700}
.oh{font-size:12.5px;color:var(--muted)}
.ledger{margin:0 0 10px;display:flex;flex-direction:column}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ledger dt{color:var(--muted)} .ledger dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ledger .sum{border-bottom:0;border-top:1.5px solid var(--ink);font-weight:700} .ledger .sum dt{color:var(--ink)}
.report{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
#toasts{position:fixed;z-index:60;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:9px;font-size:14px;box-shadow:0 8px 24px #0004;transition:opacity .4s,transform .4s}
.toast.good{background:var(--gold);color:#1a1405}
.toast.out{opacity:0;transform:translateY(8px)}

@media (max-width:1060px){
  .board{grid-template-columns:1fr}
  .panel{position:static;max-height:none}
  #tabbody{overflow:visible}
  .startgrid{grid-template-columns:1fr}
  .profile{position:static}
}
@media (max-width:640px){
  .year{border:0;padding:0}
  .topact{margin-left:0;width:100%}
  .topact .btn.primary{flex:1}
  .herotext{background:var(--bg);border-radius:0;grid-area:auto;max-width:none}
  .hero{display:block}
  .facts .wide{grid-template-columns:96px 1fr}
  .seat{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<section id="start"></section>

<section id="game" hidden>
  <header id="top"></header>
  <div class="board">
    <div class="mapcol">
      <div class="maptools">
