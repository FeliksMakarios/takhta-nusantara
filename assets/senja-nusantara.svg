<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-labelledby="t d">
  <title id="t">Senja di Nusantara, 1830</title>
  <desc id="d">Ilustrasi senja: gunung berapi berasap, perahu pinisi berlayar di laut, gerbang candi bentar dan pohon kelapa di tepi pantai.</desc>
  <defs>
    <linearGradient id="langit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17193d"/>
      <stop offset="0.38" stop-color="#4a2f5e"/>
      <stop offset="0.62" stop-color="#b65a4f"/>
      <stop offset="0.8" stop-color="#e8a24f"/>
    </linearGradient>
    <radialGradient id="cahaya" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbe2a0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#f3b55e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3b55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a6b"/>
      <stop offset="1" stop-color="#0d1330"/>
    </linearGradient>
    <linearGradient id="kabut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a24f" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8a24f" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="400" height="520" fill="url(#langit)"/>
  <!-- bintang pertama -->
  <g fill="#fbe9c2" opacity="0.8"><circle cx="48" cy="40" r="1.2"/><circle cx="122" cy="72" r="0.9"/><circle cx="300" cy="34" r="1.1"/><circle cx="356" cy="88" r="0.8"/><circle cx="210" cy="22" r="0.9"/></g>
  <!-- matahari -->
  <circle cx="262" cy="318" r="120" fill="url(#cahaya)"/>
  <circle cx="262" cy="318" r="44" fill="#fbd889"/>
  <!-- gunung berapi jauh -->
  <path d="M0 300 L60 262 L108 228 L132 214 L146 216 L170 236 L228 280 L290 300 L400 296 L400 340 L0 340 Z" fill="#5b3f6c" opacity="0.85"/>
  <path d="M126 216 C120 196 132 186 128 168 C142 178 150 160 146 146 C160 160 158 180 150 196 C148 206 150 212 146 216 Z" fill="#8a6b8a" opacity="0.45"/>
  <path d="M138 150 C128 120 150 108 142 84 C162 100 170 84 166 66" fill="none" stroke="#a98aa0" stroke-width="7" stroke-linecap="round" opacity="0.25"/>
