    <line x1="226" y1="354" x2="300" y2="354" stroke-width="2.5" opacity="0.6"/>
    <line x1="242" y1="364" x2="284" y2="364" stroke-width="2.5" opacity="0.55"/>
    <line x1="220" y1="376" x2="306" y2="376" stroke-width="2" opacity="0.4"/>
